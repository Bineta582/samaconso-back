# Broker MQTT SamaConso
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- Développement : port clair, à ne PAS exposer sur Internet -------------------------------
listener 1883

# --- Production : TLS obligatoire (générer les certificats avec ./gen-certs.sh) -----------------
# Décommenter ce bloc et supprimer le listener 1883 ci-dessus.
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
